<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3139"/><stop offset="1" stop-color="#1B1D22"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F1EA"/><stop offset="1" stop-color="#D9D3C7"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F04447"/><stop offset="1" stop-color="#C82A2D"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#3A3E47" stroke-width="4"/>
  <g filter="url(#sh)">
    <!-- handle -->
    <path d="M196 170v-34a20 20 0 0 1 20-20h80a20 20 0 0 1 20 20v34" fill="none" stroke="#ECE8E0" stroke-width="22" stroke-linecap="round"/>
    <!-- lid (red) -->
    <rect x="96" y="164" width="320" height="86" rx="22" fill="url(#lid)"/>
    <!-- body -->
    <rect x="96" y="236" width="320" height="168" rx="24" fill="url(#box)"/>
    <!-- seam -->
    <rect x="96" y="236" width="320" height="14" fill="#1F2126" opacity=".22"/>
    <!-- latch -->
    <rect x="226" y="220" width="60" height="54" rx="12" fill="#1F2126"/>
    <rect x="242" y="234" width="28" height="22" rx="6" fill="#F2B84B"/>
    <!-- tool slots on body -->
    <rect x="132" y="300" width="72" height="16" rx="8" fill="#8A9AB0"/>
    <rect x="132" y="336" width="112" height="16" rx="8" fill="#66758A"/>
    <rect x="308" y="300" width="72" height="52" rx="12" fill="#66758A"/>
  </g>
</svg>
