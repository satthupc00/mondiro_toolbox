<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Mondiro Toolbox</title>
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F1EA"/><stop offset="1" stop-color="#D9D3C7"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F04447"/><stop offset="1" stop-color="#C82A2D"/>
    </linearGradient>
  </defs>
  <g stroke="#1F2126" stroke-width="6" stroke-linejoin="round">
    <rect x="8" y="8" width="102" height="102" rx="20" fill="url(#cream)"/>
    <rect x="120" y="8" width="102" height="102" rx="20" fill="url(#cream)"/>
    <rect x="8" y="120" width="102" height="102" rx="20" fill="url(#cream)"/>
  </g>
  <!-- motion ghost: where the moving tile came from -->
  <rect x="126.5" y="126.5" width="89" height="89" rx="14" fill="none" stroke="#8A9AB0" stroke-width="13"/>
  <rect x="146" y="146" width="102" height="102" rx="20" fill="url(#red)" stroke="#1F2126" stroke-width="6" stroke-linejoin="round"/>
</svg>
